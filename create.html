<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Game</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* Centered White Card Box */
        .editor-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border: 1px solid #eee;
        }

        .header-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #333;
            margin: 0;
            font-size: 20px;
        }

        /* Back Button Style */
        .back-btn {
            background-color: #f1f1f1;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            font-size: 13px;
        }

        .back-btn:hover {
            background-color: #e2e2e2;
        }

        /* Grid Container */
        .grid-container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 2px solid #ccc;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, #e0e0e0 1px, transparent 1px),
                linear-gradient(to bottom, #e0e0e0 1px, transparent 1px);
            cursor: pointer;
        }

        /* Spawned Tile Image */
        .spawned-item {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            animation: popIn 0.15s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="editor-card">
        <!-- Top Row with Back Button and Title -->
        <div class="header-row">
            <button class="back-btn" onclick="window.location.href='Homescreen.html'">← Back</button>
            <h1>Create Game</h1>
            <div style="width: 50px;"></div> <!-- Spacer for symmetry -->
        </div>

        <!-- Grid Container -->
        <div class="grid-container" id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const TILE_SIZE = 40; // 40px grid cells

        grid.addEventListener('click', (e) => {
            const rect = grid.getBoundingClientRect();
            
            // Calculate relative click position inside the grid
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Snap position to the grid cells
            const gridX = Math.floor(clickX / TILE_SIZE) * TILE_SIZE;
            const gridY = Math.floor(clickY / TILE_SIZE) * TILE_SIZE;

            // Create new image element for grass.png
            const img = document.createElement('img');
            img.src = 'grass.png'; // Make sure test.png is in the same folder!
            img.className = 'spawned-item';
            
            // Position aligned to grid cell
            img.style.left = gridX + 'px';
            img.style.top = gridY + 'px';

            grid.appendChild(img);
        });
    </script>

</body>
</html>
