<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Login In Page</title>
</head>
<body>

<img src="test.png" alt="Test Image" style="display: block; width: 300px; height: auto; margin: 50px auto 0 auto;">

    <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="animation: fadeInSlideUp 1.0 ease-out forwards; opacity: 0; transform: translateY(20px);">
        <div style="width: 80px; height: 80px; border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
</div>

<style>
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
@keyframes fadeInSlideUp {
    to { opacity: 1; transform: translateY(0); }
}
</style>

<meta http-equiv="refresh" content="3;url=login.html">

</body>
