<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Loading Popup</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: sans-serif;
        }
        .login-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 300px;
            box-sizing: border-box;
        }
        /* Pop-up Overlay & Box */
        #loadingModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
        }
        .spinner-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #2ecc71;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Login Card -->
    <div class="login-card">
        <input type="email" placeholder="Email" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <input type="password" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        <button onclick="triggerLoading()" style="width: 100%; background-color: #2ecc71; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Continue</button>
    </div>

    <!-- Hidden Loading Modal Pop-up -->
    <div id="loadingModal">
        <div class="spinner-box">
            <div class="spinner"></div>
            <div style="font-weight: bold; color: #333; font-size: 14px;">Loading...</div>
        </div>
    </div>

    <script>
        function triggerLoading() {
            // Show the pop-up modal
            document.getElementById('loadingModal').style.display = 'flex';
            
            // Wait 6 seconds (6000 milliseconds) then redirect to next page
            setTimeout(() => {
                window.location.href = "Homescreen.html";
            }, 6000);
        }
    </script>

</body>
</html>
