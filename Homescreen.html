<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Screen Box</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f9;
            font-family: sans-serif;
        }
        .home-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
            box-sizing: border-box;
        }
        .home-card h1 {
            margin-top: 0;
            color: #333;
            font-size: 24px;
        }
        .home-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .create-btn {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .create-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="home-card">
        <h1>Welcome Home</h1>
        <p>Start building your next world or project right here.</p>
        <button class="create-btn" onclick="window.location.href='create.html';">+ Create New</button>
    </div>

</body>
</html>
